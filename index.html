<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova · Asistente</title>
<style>
:root{--c:#38d6ff;--bg:#030b14;--dim:#0d2a40;--txt:#cdeeff}
body.listen{--c:#3dffb0}
body.think{--c:#ffc83d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#0a2236,var(--bg) 70%);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;transition:--c .4s}
#orb{width:min(300px,62vw);flex:none;filter:drop-shadow(0 0 14px var(--c))}
svg{width:100%;display:block}
.spin{transform-box:view-box;transform-origin:50% 50%;animation:spin 30s linear infinite}
.spin.r{animation-duration:20s;animation-direction:reverse}
.spin.f{animation-duration:12s}
body.think .spin{animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
#core{transform-box:view-box;transform-origin:50% 50%;transition:transform .08s}
.ring{fill:none;stroke:var(--c);transition:stroke .4s}
#status{font-size:13px;letter-spacing:.08em;color:var(--c);min-height:18px}
#log{flex:1;width:min(660px,100%);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.m{max-width:85%;padding:9px 13px;border-radius:6px;line-height:1.45;background:#0a2236cc;border:1px solid var(--dim)}
.m.u{align-self:flex-end;border-color:var(--c)}
form{display:flex;gap:8px;width:min(660px,100%)}
input{flex:1;padding:12px 14px;border-radius:6px;border:1px solid var(--dim);background:#06182a;color:var(--txt);font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
button{border:1px solid var(--c);border-radius:6px;padding:0 16px;font:inherit;cursor:pointer;background:transparent;color:var(--c);min-height:44px}
button:hover{background:#38d6ff22}
#mic.on{background:var(--c);color:#031018}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="orb">
<svg viewBox="0 0 300 300" role="img" aria-label="Avatar holográfico de Nova">
  <g class="spin"><circle class="ring" cx="150" cy="150" r="142" stroke-width="1.5" stroke-dasharray="60 14 6 14"/></g>
  <g class="spin r"><circle class="ring" cx="150" cy="150" r="122" stroke-width="9" stroke-dasharray="2 9" opacity=".55"/></g>
  <g class="spin f"><circle class="ring" cx="150" cy="150" r="104" stroke-width="3" stroke-dasharray="90 40" opacity=".9"/></g>
  <g id="bars" stroke="var(--c)" stroke-width="3" stroke-linecap="round"></g>
  <g id="core">
    <circle class="ring" cx="150" cy="150" r="54" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="40" fill="var(--c)" opacity=".15"/>
    <circle cx="150" cy="150" r="22" fill="var(--c)" opacity=".85"/>
    <circle cx="150" cy="150" r="8" fill="#fff"/>
  </g>
</svg>
</div>
<div id="status" aria-live="polite">EN LÍNEA</div>
<div id="log"></div>
<form id="f">
  <input id="t" placeholder="Escribe un mensaje" autocomplete="off" aria-label="Mensaje">
  <button type="button" id="mic" aria-label="Hablar">Hablar</button>
  <button type="submit">Enviar</button>
</form>
<script>
const $=id=>document.getElementById(id);
const log=$("log"),status=$("status"),bars=$("bars"),core=$("core");
const history=[];let timer=null;
const N=72,NS="http://www.w3.org/2000/svg",lines=[];
for(let i=0;i<N;i++){const l=document.createElementNS(NS,"line");l.setAttribute("x1",150);l.setAttribute("y1",86);l.setAttribute("x2",150);l.setAttribute("y2",83);l.setAttribute("transform",`rotate(${i*360/N} 150 150)`);bars.append(l);lines.push(l)}
function setState(s,t){document.body.className=s;status.textContent=t}
function pulse(on){clearInterval(timer);
  if(!on){lines.forEach(l=>l.setAttribute("y2",83));core.style.transform="scale(1)";return}
  timer=setInterval(()=>{lines.forEach(l=>l.setAttribute("y2",83-Math.random()*20));core.style.transform="scale("+(1+Math.random()*.12)+")"},90)}
function add(text,cls){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;log.append(d);log.scrollTop=log.scrollHeight}

let voices=[];const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv;
function speak(text){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="es-MX";
  u.voice=voices.find(v=>/es[-_](MX|US|419)/i.test(v.lang))||voices.find(v=>v.lang.startsWith("es"))||null;
  u.rate=1;u.pitch=.8;
  u.onstart=()=>{setState("","HABLANDO");pulse(true)};
  u.onend=u.onerror=()=>{setState("","EN LÍNEA");pulse(false)};
  speechSynthesis.speak(u);
}
async function send(text){
  if(!text.trim())return;
  add(text,"u");history.push({role:"user",content:text});setState("think","PROCESANDO");
  try{
    const r=await fetch("/.netlify/functions/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
    const {reply}=await r.json();
    history.push({role:"assistant",content:reply});add(reply,"a");speak(reply);
  }catch(e){setState("","SIN CONEXIÓN");add("No pude conectar con el servidor. Revisa que la función de Netlify esté desplegada.","a")}
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("t").value;$("t").value="";send(v)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$("mic").style.display="none"}else{
  const rec=new SR();rec.lang="es-MX";rec.interimResults=false;
  rec.onstart=()=>{$("mic").classList.add("on");setState("listen","ESCUCHANDO")};
  rec.onend=()=>{$("mic").classList.remove("on");if(document.body.className==="listen")setState("","EN LÍNEA")};
  rec.onresult=e=>send(e.results[0][0].transcript);
  rec.onerror=()=>setState("","REVISA EL PERMISO DEL MICRÓFONO");
  $("mic").onclick=()=>{speechSynthesis.cancel();rec.start()};
}
add("Sistemas listos. ¿En qué te ayudo?","a");
</script>
</body>
</html>
